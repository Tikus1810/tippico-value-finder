services:
  - type: web
    name: value-finder
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: ODDS_API_KEY
        sync: false # trägst du selbst im Render-Dashboard ein (Environment -> Add Secret)
      - key: TIPICO_BOOKMAKER_KEY
        value: tipico_de
      - key: ODDS_API_REGION
        value: eu
      - key: CACHE_TTL_SECONDS
        value: "300"
