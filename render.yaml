services:
  - type: web
    name: value-finder
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: ODDS_API_KEY
        sync: false # trägst du selbst im Render-Dashboard ein (Environment -> Add Secret)
      - key: DATABASE_URL
        sync: false # Turso-Datenbank-URL (libsql://...), selbst im Render-Dashboard eintragen
      - key: DATABASE_AUTH_TOKEN
        sync: false # Turso-Auth-Token, selbst im Render-Dashboard eintragen
      - key: FOOTBALL_DATA_API_KEY
        sync: false # optional: football-data.org Key für Team-Form/Tabellenplatz
      - key: TIPICO_BOOKMAKER_KEY
        value: tipico_de
      - key: ODDS_API_REGION
        value: eu
      - key: CACHE_TTL_SECONDS
        value: "300"
